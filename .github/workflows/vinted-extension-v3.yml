name: Vinted extension v3 tests

on:
  push:
    paths:
      - 'browser-extension/**'
      - 'src/lib/vintedDraftUtils.ts'
      - 'src/lib/vintedImageTransfer.ts'
      - '.github/workflows/vinted-extension-v3.yml'
  pull_request:
    paths:
      - 'browser-extension/**'
      - 'src/lib/vintedDraftUtils.ts'
      - 'src/lib/vintedImageTransfer.ts'
      - '.github/workflows/vinted-extension-v3.yml'

jobs:
  vinted-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Vinted JS syntax
        run: |
          node --check browser-extension/vinted-catalog-v3.js
          node --check browser-extension/content-vinted-v3.js
          node --check browser-extension/vinted-image-edit.js
      - name: Run unit and simulated form tests
        run: node --test browser-extension/tests/catalog-v3.test.cjs browser-extension/tests/engine-v3.test.cjs browser-extension/tests/image-edit-v3.test.cjs
      - name: Test expiring image links and first-party transfer
        run: node --experimental-strip-types --test browser-extension/tests/vinted-image-transfer.test.mjs
