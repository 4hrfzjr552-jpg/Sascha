name: Sascha AI listings web app

on:
  push:
    paths:
      - 'src/**'
      - 'api/**'
      - 'tests/**'
      - 'vercel.json'
      - '.github/workflows/listings-ui.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'tests/**'
      - 'vercel.json'
      - '.github/workflows/listings-ui.yml'

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Listing correctness tests
        run: node --experimental-strip-types --test tests/article-number-validation.test.mjs tests/listing-rules.test.mjs tests/fitpic-references.test.mjs tests/fitpic-runtime-smoke.test.mjs tests/vinted-publish-schedule.test.mjs tests/analyze-pant-runtime-smoke.test.mjs tests/flatlay-listing.test.mjs tests/flatlay-quality-guard.test.mjs tests/photo-enhancement.test.mjs tests/flux-cost-guard.test.mjs
      - name: TypeScript check
        run: npm run lint
      - name: Vite production build
        run: npm run build
      - name: Bundle Vercel fitpic function (detect runtime import failures)
        run: |
          npx esbuild api/generate-fitpic.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/fitpic-function.mjs
          node --input-type=module -e "const m = await import('./dist/fitpic-function.mjs'); if (typeof m.default !== 'function') throw Error('Missing Vercel handler export')"
