name: Sascha AI listings web app

on:
  push:
    paths:
      - 'src/**'
      - 'vercel.json'
      - '.github/workflows/listings-ui.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'vercel.json'
      - '.github/workflows/listings-ui.yml'

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript check
        run: npm run lint
      - name: Vite production build
        run: npm run build
